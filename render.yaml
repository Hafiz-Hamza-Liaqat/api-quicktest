services:
  - type: web
    name: api-quicktest-proxy
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RATE_LIMIT_MAX
        value: 120
      - key: ALLOWED_ORIGINS
        value: https://hafiz-hamza-liaqat.github.io,http://localhost:5173
      - key: ALLOW_LOCALHOST
        value: "false"
